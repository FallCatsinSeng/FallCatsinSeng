<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="316" height="476" rx="16" ry="16"/>
    </clipPath>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="316" height="476" rx="16" ry="16" fill="url(#bgGrad)" />

  <!-- Animated Border -->
  <rect x="1" y="1" width="318" height="478" rx="17" ry="17" fill="none" stroke="#42a5f5" stroke-width="2" filter="url(#glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#42a5f5;#90caf9;#1a237e;#42a5f5" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid -->
  <g stroke="#1a237e" stroke-width="0.5" opacity="0.4" clip-path="url(#cardClip)">
    <line x1="0" y1="60" x2="320" y2="60"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="180" x2="320" y2="180"/>
    <line x1="0" y1="240" x2="320" y2="240"/>
    <line x1="0" y1="300" x2="320" y2="300"/>
    <line x1="0" y1="360" x2="320" y2="360"/>
    <line x1="0" y1="420" x2="320" y2="420"/>
    <line x1="60" y1="0" x2="60" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
  </g>

  <!-- Corners -->
  <g stroke="#42a5f5" stroke-width="2" fill="none" opacity="0.7">
    <line x1="10" y1="10" x2="30" y2="10"/>
    <line x1="10" y1="10" x2="10" y2="30"/>
    <line x1="290" y1="10" x2="310" y2="10"/>
    <line x1="310" y1="10" x2="310" y2="30"/>
    <line x1="10" y1="470" x2="30" y2="470"/>
    <line x1="10" y1="450" x2="10" y2="470"/>
    <line x1="290" y1="470" x2="310" y2="470"/>
    <line x1="310" y1="450" x2="310" y2="470"/>
  </g>

  <!-- Headers -->
  <rect x="20" y="18" width="130" height="22" rx="4" fill="#1a237e" opacity="0.9"/>
  <text x="85" y="33" font-family="monospace" font-size="10" fill="#90caf9" text-anchor="middle" letter-spacing="2">ENGINEERING</text>

  <rect x="200" y="18" width="100" height="22" rx="4" fill="#0d1b5e" opacity="0.9"/>
  <text x="250" y="33" font-family="monospace" font-size="10" fill="#7986cb" text-anchor="middle" letter-spacing="1">ID: 0xMY-DEV</text>

  <line x1="20" y1="50" x2="300" y2="50" stroke="#283593" stroke-width="1"/>
  <circle cx="20" cy="50" r="2" fill="#42a5f5"/>
  <circle cx="300" cy="50" r="2" fill="#42a5f5"/>

  <!-- Backend Hologram Emblem (Center Design) -->
  <g transform="translate(160, 165)">
    <!-- Outer orbiting rings -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#42a5f5" stroke-width="1.5" stroke-dasharray="10 6 2 6" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#90caf9" stroke-width="1" stroke-dasharray="20 10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Code brackets -->
    <text x="-40" y="14" font-family="monospace" font-size="40" fill="#42a5f5" opacity="0.7" filter="url(#textGlow)">&lt;</text>
    <text x="40" y="14" font-family="monospace" font-size="40" fill="#42a5f5" opacity="0.7" filter="url(#textGlow)" text-anchor="end">&gt;</text>
    
    <!-- Central server stack graphic -->
    <g transform="translate(-25, -28)">
      <!-- Server 1 -->
      <rect x="0" y="0" width="50" height="14" rx="2" fill="#1a237e" stroke="#90caf9" stroke-width="1.5"/>
      <circle cx="8" cy="7" r="2.5" fill="#4caf50">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="7" r="1.5" fill="#bbdefb"/>
      <circle cx="42" cy="7" r="1.5" fill="#bbdefb"/>
      
      <!-- Server 2 -->
      <rect x="0" y="20" width="50" height="14" rx="2" fill="#1a237e" stroke="#90caf9" stroke-width="1.5"/>
      <circle cx="8" cy="27" r="2.5" fill="#4caf50">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="27" r="1.5" fill="#bbdefb"/>
      
      <!-- Server 3 -->
      <rect x="0" y="40" width="50" height="14" rx="2" fill="#1a237e" stroke="#90caf9" stroke-width="1.5"/>
      <circle cx="8" cy="47" r="2.5" fill="#f44336">
        <animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="250" r="2" fill="#42a5f5" opacity="0.6"><animate attributeName="cy" values="250;65;250" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="200" r="1.5" fill="#90caf9" opacity="0.5"><animate attributeName="cy" values="200;65;200" dur="5s" repeatCount="indefinite" begin="1s"/><animate attributeName="opacity" values="0.5;0;0.5" dur="5s" repeatCount="indefinite" begin="1s"/></circle>

  <line x1="20" y1="295" x2="300" y2="295" stroke="#283593" stroke-width="1"/>
  <circle cx="20" cy="295" r="2" fill="#42a5f5"/>
  <circle cx="300" cy="295" r="2" fill="#42a5f5"/>

  <!-- Info -->
  <text x="160" y="322" font-family="Georgia, serif" font-size="20" fill="#90caf9" text-anchor="middle" font-weight="bold" filter="url(#textGlow)">Maulana Yusuf</text>
  <text x="160" y="342" font-family="monospace" font-size="10" fill="#7986cb" text-anchor="middle" letter-spacing="2">FallCatsinSeng</text>

  <rect x="90" y="352" width="140" height="22" rx="11" fill="#1a237e"/>
  <text x="160" y="367" font-family="monospace" font-size="10" fill="#bbdefb" text-anchor="middle" letter-spacing="1">Backend Developer</text>

  <text x="160" y="400" font-family="Georgia, serif" font-size="9" fill="#9fa8da" text-anchor="middle" font-style="italic">"Data doesn't lie."</text>
  <text x="160" y="415" font-family="Georgia, serif" font-size="8.5" fill="#7986cb" text-anchor="middle" font-style="italic">"Code shouldn't either."</text>

  <!-- Status Bar -->
  <rect x="20" y="435" width="280" height="8" rx="4" fill="#0d1654"/>
  <rect x="20" y="435" width="224" height="8" rx="4" fill="#1a237e"><animate attributeName="width" values="100;224;180;224" dur="4s" repeatCount="indefinite"/></rect>
  <text x="160" y="458" font-family="monospace" font-size="8" fill="#42a5f5" text-anchor="middle">SYSTEM: ONLINE ▮</text>

  <rect x="2" y="2" width="316" height="3" rx="0" fill="#42a5f5" opacity="0.15" clip-path="url(#cardClip)"><animate attributeName="y" values="2;478;2" dur="5s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0.2;0" dur="5s" repeatCount="indefinite"/></rect>
</svg>
